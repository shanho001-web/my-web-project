<!-- Firebase SDK (ES Module) & 完整後端邏輯串接 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        signInWithPopup, 
        GoogleAuthProvider, 
        signOut,
        onAuthStateChanged // <-- 新增這行
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, 
        doc, 
        getDoc, 
        setDoc, 
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // --- 新增：監聽登入狀態 ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // 使用者已登入！
            // 這裡決定你要做什麼：
            // 方案 A: 強制跳轉 (你目前可能就是這樣)
            // const userSnap = await getDoc(doc(db, "users", user.uid));
            // if (userSnap.exists() && userSnap.data().role === 'admin') window.location.href = 'admin-dashboard.html';
            // else window.location.href = 'member-dashboard.html';

            // 方案 B: (推薦) 在網頁上顯示一個「回到後台」按鈕，而不是隱藏整個登入頁
            console.log("使用者已登入，可選擇顯示回到後台按鈕");
            // 你可以在這裡用 DOM 操作把原本的表單隱藏，顯示一個「回到後台」按鈕
        } else {
            console.log("使用者未登入，顯示登入頁面");
        }
    });

    // --- 函式掛載 ---
    window.handleGoogleSignIn = async function() {
        try {
            const result = await signInWithPopup(auth, googleProvider);
            const user = result.user;
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || '',
                    role: 'member',
                    createdAt: serverTimestamp()
                });
                window.location.href = 'member-dashboard.html';
            } else {
                const userData = userSnap.data();
                if (userData.role === 'admin') window.location.href = 'admin-dashboard.html';
                else window.location.href = 'member-dashboard.html';
            }
        } catch (error) {
            alert("Google 登入失敗: " + error.message);
        }
    };

    window.handleMemberLogin = async function(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = 'member-dashboard.html';
        } catch (error) {
            alert("會員登入失敗: " + error.message);
        }
    };

    window.handleMemberRegister = async function(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            await setDoc(doc(db, "users", user.uid), {
                uid: user.uid,
                email: email,
                displayName: name,
                role: 'member',
                createdAt: serverTimestamp()
            });
            window.location.href = 'member-dashboard.html';
        } catch (error) {
            alert("註冊失敗: " + error.message);
        }
    };

    window.handleAdminLogin = async function(e) {
        e.preventDefault();
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists() && userSnap.data().role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                await signOut(auth);
                alert("權限不足：該帳號非管理員帳號");
            }
        } catch (error) {
            alert("Admin 登入失敗: " + error.message);
        }
    };
</script>
