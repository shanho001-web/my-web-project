<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報銷管理系統</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .form-box { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 5px; background: #fafafa; }
    input, select { margin: 5px 0; padding: 8px; width: 100%; max-width: 300px; display: block; }
    button { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; margin-top: 10px; border-radius: 4px;}
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #eee; }
    .admin-badge { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h1>報銷管理系統 <span id="userDisplay"></span></h1>
  <button id="logoutBtn" style="background: #dc3545;">登出</button>

  <div class="form-box">
    <h3>新增 Claim 單</h3>
    <label>分類：</label>
    <select id="claimCategory">
      <option value="交通費">交通費</option>
      <option value="餐飲費">餐飲費</option>
      <option value="採購費">採購費</option>
      <option value="其他">其他</option>
    </select>
    <label>價錢：</label>
    <input type="number" id="claimPrice" placeholder="輸入金額">
    <label>人名：</label>
    <input type="text" id="claimName" placeholder="輸入申請人姓名">
    <label>日期：</label>
    <input type="date" id="claimDate">
    <label>上傳單據 (相片或 PDF)：</label>
    <input type="file" id="claimReceipt" accept="image/*,.pdf">
    <button id="submitBtn">送出表單</button>
    <p id="statusMsg"></p>
  </div>

  <h3>單據紀錄表</h3>
  <table>
    <thead>
      <tr><th>日期</th><th>人名</th><th>分類</th><th>價錢</th><th>單據檔案</th></tr>
    </thead>
    <tbody id="dataTable"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8c7DvOJnnRHYnJtcK5ds6-VDGH7vCkEY",
      authDomain: "mywebproject-b01e6.firebaseapp.com",
      projectId: "mywebproject-b01e6",
      storageBucket: "mywebproject-b01e6.firebasestorage.app",
      messagingSenderId: "971882120028",
      appId: "1:971882120028:web:80b7e3be5a1ec68ebb7799"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // 檢查登入狀態
    const role = localStorage.getItem("userRole");
    const email = localStorage.getItem("userEmail");
    if (!role) { window.location.href = "login.html"; }

    document.getElementById("userDisplay").innerHTML = role === "admin" 
      ? `(<span class="admin-badge">Admin</span>)` : `(${email})`;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "login.html";
    });

    // 讀取資料
    async function loadData() {
      const dataTable = document.getElementById("dataTable");
      dataTable.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "claims"));
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (role === "admin" || data.uploader === email) {
          dataTable.innerHTML += `<tr><td>${data.date}</td><td>${data.name}</td><td>${data.category}</td><td>$${data.price}</td><td><a href="${data.receiptUrl}" target="_blank">檢視</a></td></tr>`;
        }
      });
    }
    loadData();

    // 上傳功能
    document.getElementById("submitBtn").addEventListener("click", async () => {
      const file = document.getElementById("claimReceipt").files[0];
      if (!file) return alert("請選擇檔案");
      
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.innerText = "正在處理中，請稍候...";
      console.log("開始上傳...");

      try {
        const storageRef = ref(storage, 'receipts/' + Date.now() + '_' + file.name);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        
        await addDoc(collection(db, "claims"), {
          category: document.getElementById("claimCategory").value,
          price: document.getElementById("claimPrice").value,
          name: document.getElementById("claimName").value,
          date: document.getElementById("claimDate").value,
          receiptUrl: url,
          uploader: email
        });
        
        alert("成功上傳！");
        statusMsg.innerText = "完成";
        loadData();
      } catch (error) {
        console.error(error);
        alert("上傳失敗：" + error.message);
        statusMsg.innerText = "錯誤：" + error.message;
      }
    });
  </script>
</body>
</html>
