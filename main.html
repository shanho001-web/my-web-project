<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>報銷管理系統</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f7f6; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
<div class="container">
  <h1>報銷系統主頁</h1>
  <button id="logoutBtn">登出</button>
  <!-- 你的表單與表格代碼放在這裡 -->
</div>

<script type="module">
  // 檢查登入
  if (!localStorage.getItem("userEmail")) window.location.href = "index.html"; // 沒登入跳回首頁
  document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); window.location.href = "index.html"; };
</script>
</body>
</html>
